<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — DevTrack</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg app-navbar sticky-top px-2 px-lg-3">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/app.html">
      <span class="brand-logo"><i class="bi bi-kanban-fill"></i></span>
      <span>DevTrack</span>
    </a>
    <div class="ms-auto d-flex align-items-center gap-2">
      <a href="/app.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back to App</a>
      <span class="small text-secondary d-none d-sm-inline" id="adminWhoAmI"></span>
      <button class="btn btn-sm btn-outline-danger" id="btnLogout"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
    </div>
  </div>
</nav>

<main class="app-main" style="padding:1.5rem;">
  <div class="mb-3">
    <h3 class="fw-bold mb-0"><i class="bi bi-shield-lock-fill me-2"></i>User Administration</h3>
    <p class="text-secondary small mb-0">Approve, suspend, or promote accounts. Only admins can see this page.</p>
  </div>

  <div id="adminAlert" class="alert d-none" role="alert"></div>

  <div class="row g-3 mb-3" id="adminStatsRow"></div>

  <div class="glass-card p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Joined</th>
            <th style="width:280px;">Actions</th>
          </tr>
        </thead>
        <tbody id="adminUsersBody"></tbody>
      </table>
    </div>
  </div>
  <div id="adminEmptyState" class="empty-state d-none"><i class="bi bi-people"></i><p>No users yet.</p></div>
</main>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="admin.js" defer></script>
</body>
</html>

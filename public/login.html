<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — DevTrack</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-wrap">
    <div class="glass-card auth-card p-4 p-md-5">
      <div class="text-center mb-4">
        <span class="brand-logo mx-auto mb-2"><i class="bi bi-kanban-fill"></i></span>
        <h3 class="fw-bold mb-0">DevTrack</h3>
        <p class="text-secondary small mb-0">Sign in to your workspace</p>
      </div>

      <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Email</label>
          <input type="email" class="form-control" id="loginEmail" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Password</label>
          <input type="password" class="form-control" id="loginPassword" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-100" id="loginSubmitBtn">
          <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
        </button>
      </form>

      <p class="text-center small text-secondary mt-4 mb-0">
        Don't have an account? <a href="/register.html">Register</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="login.js" defer></script>
</body>
</html>

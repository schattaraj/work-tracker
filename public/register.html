<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — DevTrack</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-wrap">
    <div class="glass-card auth-card p-4 p-md-5">
      <div class="text-center mb-4">
        <span class="brand-logo mx-auto mb-2"><i class="bi bi-kanban-fill"></i></span>
        <h3 class="fw-bold mb-0">Create Account</h3>
        <p class="text-secondary small mb-0">An admin will need to approve you before you can sign in</p>
      </div>

      <div id="registerAlert" class="alert alert-danger d-none" role="alert"></div>

      <div id="registerSuccess" class="d-none text-center py-3">
        <i class="bi bi-check-circle-fill text-success" style="font-size:2.5rem;"></i>
        <p class="mt-3 mb-1 fw-semibold">Account created!</p>
        <p class="text-secondary small">An admin needs to approve your account before you can log in. Check back soon.</p>
        <a href="/login.html" class="btn btn-primary mt-2"><i class="bi bi-box-arrow-in-right me-1"></i>Go to Sign In</a>
      </div>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Name</label>
          <input type="text" class="form-control" id="registerName" required autocomplete="name">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Email</label>
          <input type="email" class="form-control" id="registerEmail" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Password</label>
          <input type="password" class="form-control" id="registerPassword" required minlength="8" autocomplete="new-password">
          <div class="form-text">At least 8 characters.</div>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Confirm Password</label>
          <input type="password" class="form-control" id="registerConfirm" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary w-100" id="registerSubmitBtn">
          <i class="bi bi-person-plus me-1"></i>Create Account
        </button>
      </form>

      <p class="text-center small text-secondary mt-4 mb-0" id="registerLoginLink">
        Already have an account? <a href="/login.html">Sign In</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="register.js" defer></script>
</body>
</html>
